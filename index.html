<!DOCTYPE html>
<html lang="pl" data-theme="purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="theme-color" content="#07070f">
<title>GymLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">

<!-- PWA Manifest inline -->
<script>
const manifest = {
  name: "GymLog",
  short_name: "GymLog",
  description: "Osobisty tracker treningów",
  start_url: ".",
  display: "standalone",
  background_color: "#07070f",
  theme_color: "#07070f",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text y='.9em' font-size='70' x='50%' text-anchor='middle'>⚡</text></svg>", sizes: "192x192", type: "image/svg+xml" }
  ]
};
const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(blob);
document.write(`<link rel="manifest" href="${manifestURL}">`);
</script>

<style>
/* ===== THEMES ===== */
[data-theme="purple"] {
  --bg0:#07070f;--bg1:#0f0f1e;--bg2:#16162a;--bg3:#1e1e38;
  --accent:#7c3aed;--accent2:#a855f7;--accent3:#c084fc;
  --glow:rgba(124,58,237,.35);--glow2:rgba(168,85,247,.2);
  --text:#e8e8ff;--text2:#9d9dbf;--text3:#5a5a7a;
  --green:#22c55e;--greenDim:#16a34a;--greenBg:rgba(34,197,94,.12);
  --red:#f87171;--yellow:#facc15;--border:rgba(124,58,237,.25);
  --card-glow:0 0 20px rgba(124,58,237,.1);
  --nav-bg:#0a0a1a;
}
[data-theme="green"] {
  --bg0:#030f07;--bg1:#071a0d;--bg2:#0d2618;--bg3:#123320;
  --accent:#16a34a;--accent2:#22c55e;--accent3:#4ade80;
  --glow:rgba(22,163,74,.35);--glow2:rgba(34,197,94,.2);
  --text:#e8ffe8;--text2:#7fbf7f;--text3:#3d6e3d;
  --green:#4ade80;--greenDim:#22c55e;--greenBg:rgba(74,222,128,.12);
  --red:#f87171;--yellow:#facc15;--border:rgba(22,163,74,.25);
  --card-glow:0 0 20px rgba(22,163,74,.1);
  --nav-bg:#030f07;
}
[data-theme="teal"] {
  --bg0:#f0fafa;--bg1:#e4f4f4;--bg2:#ffffff;--bg3:#f8fdfd;
  --accent:#0891b2;--accent2:#06b6d4;--accent3:#0e7490;
  --glow:rgba(8,145,178,.2);--glow2:rgba(6,182,212,.1);
  --text:#0f2937;--text2:#4a7f90;--text3:#9bc0cc;
  --green:#16a34a;--greenDim:#15803d;--greenBg:rgba(22,163,74,.1);
  --red:#dc2626;--yellow:#d97706;--border:rgba(8,145,178,.2);
  --card-glow:0 2px 16px rgba(8,145,178,.08);
  --nav-bg:#d8eeee;
}
[data-theme="gray"] {
  --bg0:#080808;--bg1:#111111;--bg2:#1a1a1a;--bg3:#222222;
  --accent:#6b7280;--accent2:#9ca3af;--accent3:#d1d5db;
  --glow:rgba(107,114,128,.3);--glow2:rgba(156,163,175,.15);
  --text:#f9fafb;--text2:#9ca3af;--text3:#4b5563;
  --green:#22c55e;--greenDim:#16a34a;--greenBg:rgba(34,197,94,.1);
  --red:#f87171;--yellow:#facc15;--border:rgba(107,114,128,.2);
  --card-glow:0 0 20px rgba(107,114,128,.08);
  --nav-bg:#080808;
}

/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;height:100%;}
body{
  background:var(--bg0);color:var(--text);
  font-family:'Rajdhani',sans-serif;
  height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
input,textarea,select,button{font-family:inherit;font-size:1rem;}
button{cursor:pointer;border:none;outline:none;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}
::selection{background:var(--accent);color:#fff;}

/* ===== AUTH SCREEN ===== */
#auth-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg0);padding:20px;padding-top:calc(20px + env(safe-area-inset-top));
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  overflow-y:auto;z-index:9999;
}
.auth-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:24px;
  padding:36px 24px;width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.auth-logo{
  text-align:center;margin-bottom:32px;
  font-size:2.2rem;font-weight:700;letter-spacing:6px;
  background:linear-gradient(135deg,var(--accent2),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.auth-tabs{display:flex;margin-bottom:24px;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.auth-tab{
  flex:1;padding:14px;text-align:center;font-weight:700;font-size:.85rem;
  letter-spacing:2px;background:transparent;color:var(--text2);transition:all .2s;
}
.auth-tab.active{background:var(--accent);color:#fff;}
.auth-error{
  background:rgba(248,113,113,.1);border:1px solid var(--red);border-radius:10px;
  padding:12px 16px;font-size:.85rem;color:var(--red);margin-bottom:16px;display:none;
}
.auth-success{
  background:rgba(34,197,94,.1);border:1px solid var(--green);border-radius:10px;
  padding:12px 16px;font-size:.85rem;color:var(--green);margin-bottom:16px;display:none;
}
.auth-or{text-align:center;color:var(--text3);font-size:.8rem;margin:20px 0;position:relative;}
.auth-or::before,.auth-or::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border);}
.auth-or::before{left:0;}.auth-or::after{right:0;}
.offline-note{text-align:center;margin-top:16px;font-size:.8rem;color:var(--text3);line-height:1.6;}

/* ===== APP SHELL ===== */
#app{
  display:none;position:fixed;inset:0;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
#app.visible{display:flex;}

/* ===== HEADER ===== */
.app-header{
  background:var(--bg1);border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;backdrop-filter:blur(12px);
}
.logo{
  font-size:1.4rem;font-weight:700;letter-spacing:4px;
  background:linear-gradient(135deg,var(--accent2),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header-right{display:flex;align-items:center;gap:10px;}
.user-badge{
  font-size:.72rem;color:var(--text2);letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.sync-indicator{
  width:8px;height:8px;border-radius:50%;background:var(--text3);
  transition:background .3s;flex-shrink:0;
}
.sync-indicator.synced{background:var(--green);}
.sync-indicator.syncing{background:var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.btn-logout{
  padding:7px 14px;border-radius:8px;font-size:.72rem;font-weight:700;
  letter-spacing:1px;background:var(--bg3);border:1px solid var(--border);
  color:var(--text2);min-height:36px;
}

/* ===== SCROLL AREA ===== */
.scroll-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:16px 14px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
.tab-pane{display:none;animation:fadeIn .2s ease;}
.tab-pane.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--nav-bg);border-top:1px solid var(--border);
  display:flex;align-items:center;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:100;flex-shrink:0;
  backdrop-filter:blur(16px);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 4px;gap:3px;background:transparent;
  color:var(--text3);transition:color .15s;
  min-height:56px;
}
.nav-btn.active{color:var(--accent2);}
.nav-btn .nav-icon{font-size:1.3rem;line-height:1;}
.nav-btn .nav-label{font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.nav-btn.active .nav-label{color:var(--accent3);}

/* ===== CARDS ===== */
.card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:16px;margin-bottom:12px;
  box-shadow:var(--card-glow);
}
.card.done{
  border-color:var(--green)!important;background:var(--greenBg);
  box-shadow:0 0 20px rgba(34,197,94,.15)!important;
}

/* ===== BUTTONS ===== */
.btn{
  padding:13px 22px;border-radius:10px;font-weight:700;font-size:.9rem;
  letter-spacing:2px;transition:all .15s;min-height:46px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 0 16px var(--glow);}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-success{background:var(--green);color:#000;}
.btn-danger{background:var(--red);color:#fff;}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn-sm{padding:9px 16px;font-size:.8rem;min-height:38px;border-radius:8px;}
.btn-block{width:100%;display:flex;}

/* Form elements */
.form-field{margin-bottom:16px;}
.form-label{font-size:.8rem;font-weight:700;letter-spacing:2px;color:var(--text2);margin-bottom:8px;display:block;}
.form-input{
  width:100%;padding:13px 14px;border-radius:10px;
  background:var(--bg0);border:1px solid var(--border);
  color:var(--text);font-size:1rem;transition:border .2s;
  -webkit-appearance:none;appearance:none;
}
.form-input:focus{border-color:var(--accent);}
.form-row{display:flex;gap:10px;}
.form-row .form-field{flex:1;}

/* ===== DAY SELECTOR — horizontal scroll ===== */
.day-scroll{
  display:flex;gap:10px;
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:4px;
  margin-bottom:16px;
}
.day-scroll::-webkit-scrollbar{display:none;}
.day-btn{
  flex-shrink:0;scroll-snap-align:start;
  width:140px;padding:14px 12px;border-radius:14px;
  background:var(--bg2);border:1px solid var(--border);
  color:var(--text2);font-weight:600;font-size:.8rem;letter-spacing:1px;
  transition:all .2s;text-align:center;line-height:1.4;
}
.day-btn.active{
  background:var(--bg3);border-color:var(--accent);color:var(--accent3);
  box-shadow:0 0 14px var(--glow);
}
.day-btn .day-emoji{font-size:1.5rem;display:block;margin-bottom:6px;}
.day-btn .day-sub{font-size:.65rem;color:var(--text3);display:block;margin-top:3px;}

/* ===== TIMER BAR ===== */
.timer-bar{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:18px 16px;margin-bottom:16px;text-align:center;
}
.timer-display{
  font-family:'JetBrains Mono',monospace;font-size:3.2rem;font-weight:700;
  color:var(--accent3);letter-spacing:4px;
  text-shadow:0 0 24px var(--glow);margin-bottom:14px;
}
.timer-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:16px;}
.progress-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s ease;}
.progress-label{font-size:.78rem;color:var(--text2);letter-spacing:1px;margin-top:6px;}

/* ===== EXERCISE CARD ===== */
.ex-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
  transition:all .3s;
}
.ex-card.done{border-color:var(--green);background:var(--greenBg);}
.ex-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;cursor:pointer;
  background:var(--bg3);
}
.ex-icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:700;flex-shrink:0;color:#fff;
}
.ex-card.done .ex-icon{background:var(--green);}
.ex-name{font-weight:700;font-size:1rem;letter-spacing:1px;color:var(--text);flex:1;}
.ex-meta{font-size:.78rem;color:var(--text2);letter-spacing:1px;margin-top:2px;}
.ex-progress{display:flex;gap:4px;align-items:center;}
.ex-dot{width:9px;height:9px;border-radius:50%;background:var(--text3);transition:background .3s;}
.ex-dot.done{background:var(--green);}
.ex-done-badge{
  font-size:.7rem;font-weight:700;letter-spacing:2px;
  color:var(--green);padding:3px 8px;
  border:1px solid var(--green);border-radius:5px;
}

/* Sets */
.ex-sets{padding:0 16px 14px;}
.set-row{
  padding:12px 0;border-bottom:1px solid var(--border);
}
.set-row:last-child{border-bottom:none;}
.set-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.set-label{
  font-family:'JetBrains Mono',monospace;font-size:.8rem;
  color:var(--text2);letter-spacing:1px;min-width:50px;font-weight:700;
}
.weight-input{
  width:80px;padding:9px 10px;border-radius:8px;
  background:var(--bg0);border:1px solid var(--border);
  color:var(--text);font-family:'JetBrains Mono',monospace;
  font-size:1rem;text-align:center;
  -webkit-appearance:none;appearance:none;
}
.weight-unit{font-size:.8rem;color:var(--text3);font-weight:600;}
.suggested-weight{
  font-size:.65rem;color:var(--accent3);letter-spacing:1px;
  background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2);
  border-radius:5px;padding:3px 8px;cursor:pointer;
}
.reps-container{display:flex;gap:6px;flex-wrap:wrap;}
.rep-btn{
  width:36px;height:36px;border-radius:8px;
  background:var(--bg0);border:1px solid var(--border);
  color:var(--text3);font-family:'JetBrains Mono',monospace;
  font-size:.8rem;font-weight:700;transition:all .12s;
}
.rep-btn.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.rep-btn.last-done{background:var(--green);border-color:var(--green);color:#000;}
.max-input{
  width:70px;padding:9px 10px;border-radius:8px;
  background:var(--bg0);border:1px solid var(--border);
  color:var(--text);font-family:'JetBrains Mono',monospace;
  font-size:1rem;text-align:center;-webkit-appearance:none;
}
.set-done-btn{
  padding:9px 16px;border-radius:8px;font-size:.78rem;font-weight:700;
  letter-spacing:1px;background:var(--bg0);border:1px solid var(--border);
  color:var(--text2);transition:all .2s;min-height:40px;
}
.set-done-btn.done{background:var(--green);border-color:var(--green);color:#000;}

/* Simple set completion row */
.set-done-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;
}
.reps-info{
  font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;
  color:var(--accent3);letter-spacing:1px;
}
.big-done-btn{
  padding:12px 28px;border-radius:10px;font-size:.9rem;font-weight:700;
  letter-spacing:2px;background:var(--bg0);border:2px solid var(--border);
  color:var(--text2);transition:all .2s;min-height:46px;min-width:140px;
}
.big-done-btn.done{
  background:var(--green);border-color:var(--green);color:#000;
  box-shadow:0 0 16px rgba(34,197,94,.3);
}

/* Timer exercise */
.timer-set{display:flex;align-items:center;gap:12px;}
.timer-countdown{
  font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700;
  color:var(--accent3);min-width:55px;
}
.timer-start-btn{
  padding:9px 18px;border-radius:8px;font-size:.85rem;font-weight:700;
  background:var(--accent);color:#fff;border:none;min-height:40px;
}
.timer-start-btn.done{background:var(--green);color:#000;}

/* Workout summary */
.workout-summary{text-align:center;padding:40px 20px;}
.summary-icon{font-size:4rem;margin-bottom:12px;}
.summary-title{font-size:1.8rem;font-weight:700;color:var(--green);margin-bottom:8px;}
.summary-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.summary-stat{
  background:var(--bg3);border:1px solid var(--border);border-radius:12px;
  padding:14px 18px;text-align:center;flex:1;min-width:90px;
}
.summary-stat .val{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--accent3);}
.summary-stat .lbl{font-size:.72rem;color:var(--text2);letter-spacing:1px;margin-top:4px;}

/* ===== PLAN TAB ===== */
.plan-day{margin-bottom:20px;}
.plan-day-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px 14px 0 0;border-bottom:none;
}
.plan-day-title{font-size:1rem;font-weight:700;letter-spacing:2px;color:var(--accent3);}
.plan-day-sub{font-size:.75rem;color:var(--text2);letter-spacing:1px;margin-left:auto;}
.plan-exercises{background:var(--bg1);border:1px solid var(--border);border-radius:0 0 14px 14px;overflow:hidden;}
.plan-ex-row{
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--border);
}
.plan-ex-row:last-child{border-bottom:none;}
.plan-ex-name{flex:1;font-weight:600;font-size:.95rem;}
.plan-ex-detail{font-size:.78rem;color:var(--text2);font-family:'JetBrains Mono',monospace;}
.plan-btn{
  padding:7px 14px;border-radius:8px;font-size:.75rem;font-weight:700;
  letter-spacing:1px;background:var(--bg3);border:1px solid var(--border);
  color:var(--text2);min-height:36px;
}
.add-ex-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 16px;background:transparent;border:1px dashed var(--border);
  color:var(--text2);font-weight:600;letter-spacing:1px;font-size:.85rem;
  border-radius:10px;width:100%;margin-top:10px;min-height:46px;
}

/* ===== TRACKER TAB ===== */
.tracker-nav{display:flex;gap:8px;margin-bottom:16px;}
.tracker-btn{
  flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:.8rem;
  letter-spacing:2px;background:var(--bg2);border:1px solid var(--border);
  color:var(--text2);text-align:center;
}
.tracker-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--glow);}

/* Month */
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.month-title{font-size:1.1rem;font-weight:700;letter-spacing:2px;color:var(--accent3);}
.month-nav-btn{
  padding:8px 14px;border-radius:8px;font-size:.8rem;font-weight:700;letter-spacing:1px;
  background:var(--bg2);border:1px solid var(--border);color:var(--text2);min-height:38px;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:3px;
}
.cal-day-label{text-align:center;font-size:.62rem;font-weight:700;color:var(--text3);letter-spacing:.5px;padding:4px 0;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:8px;cursor:pointer;transition:all .2s;
  background:var(--bg2);border:1px solid transparent;
  font-size:.7rem;
}
.cal-cell.empty{background:transparent;cursor:default;}
.cal-cell.future{opacity:.3;}
.cal-cell.today{border-color:var(--accent2)!important;}
.cal-cell.no-workout{background:var(--bg2);}
.cal-cell.low{background:rgba(22,101,52,.4);}
.cal-cell.partial{background:var(--greenDim);opacity:.7;}
.cal-cell.full{background:var(--green);}
.cal-day-num{font-size:.7rem;font-weight:700;color:var(--text2);}
.cal-day-icon{font-size:.6rem;}

async function hashPwd(password){
  const enc = new TextEncoder().encode(password + 'gymlog_salt_2024');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function sbRest(table, options={}){

    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${filter?'?'+filter:''}`, {
      method,
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json',
        'Prefer': prefer,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    if(!res.ok) return { data: null, error: text || res.statusText };
    if(!text) return { data: null, error: null };

// ===== AUTH =====
function switchAuthTab(tab){
  document.getElementById('atab-login').classList.toggle('active', tab==='login');
  document.getElementById('atab-register').classList.toggle('active', tab==='register');
  document.getElementById('login-form').style.display = tab==='login'?'':'none';
  document.getElementById('register-form').style.display = tab==='register'?'':'none';
  hideAuthMsg();
}
function showAuthError(msg){ const el=document.getElementById('auth-error'); el.textContent=msg; el.style.display='block'; document.getElementById('auth-success').style.display='none'; }
function showAuthSuccess(msg){ const el=document.getElementById('auth-success'); el.textContent=msg; el.style.display='block'; document.getElementById('auth-error').style.display='none'; }
function hideAuthMsg(){ document.getElementById('auth-error').style.display='none'; document.getElementById('auth-success').style.display='none'; }

async function doLogin(){
  const username = document.getElementById('login-user').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;
  if(!username||!pass){ showAuthError('Podaj nazwę użytkownika i hasło.'); return; }
  hideAuthMsg(); showAuthSuccess('Logowanie...');
  const hash = await hashPwd(pass);
  const { data, error } = await sbRest('gymlog_users', { filter: `username=eq.${encodeURIComponent(username)}&password_hash=eq.${hash}&select=id,username` });
  if(error){ showAuthError('Błąd połączenia: ' + error); return; }
  if(!data || data.length === 0){ showAuthError('Nieprawidłowa nazwa użytkownika lub hasło.'); return; }
  currentUser = { id: data[0].id, username: data[0].username };
  save('gl_session_user', currentUser);
  isOfflineMode = false;
  await loadFromSupabase();
  enterApp();
}

async function doRegister(){
  const username = document.getElementById('reg-user').value.trim().toLowerCase();
  const pass = document.getElementById('reg-pass').value;
  if(!username||!pass){ showAuthError('Podaj nazwę użytkownika i hasło.'); return; }
  if(username.length < 3){ showAuthError('Nazwa użytkownika musi mieć min. 3 znaki.'); return; }
  if(!/^[a-z0-9_]+$/.test(username)){ showAuthError('Tylko litery, cyfry i podkreślnik (_).'); return; }
  if(pass.length < 6){ showAuthError('Hasło musi mieć minimum 6 znaków.'); return; }
  hideAuthMsg(); showAuthSuccess('Rejestracja...');
  const { data: existing } = await sbRest('gymlog_users', { filter: `username=eq.${encodeURIComponent(username)}&select=id` });
  if(existing && existing.length > 0){ showAuthError('Ta nazwa użytkownika jest już zajęta.'); return; }
  const hash = await hashPwd(pass);
  const { data, error } = await sbRest('gymlog_users', { method: 'POST', body: { username, password_hash: hash }, prefer: 'return=representation' });
  if(error){ showAuthError('Błąd rejestracji: ' + error); return; }
  if(!data || data.length === 0){ showAuthError('Błąd rejestracji — spróbuj ponownie.'); return; }
  currentUser = { id: data[0].id, username: data[0].username };
  save('gl_session_user', currentUser);
  isOfflineMode = false;
  enterApp();
}

function doLogout(){
  save('gl_session_user', null);
  currentUser = null; isOfflineMode = false;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  hideAuthMsg();
}

function scheduleSyncToSupabase(){

async function syncToSupabase(){

  const { error } = await sbRest('gymlog_data', { method: 'POST', body: payload, prefer: 'resolution=merge-duplicates,return=minimal' });
  if(error){ console.warn('Sync error:', error); setSyncStatus(''); }
  else setSyncStatus('synced');
}
async function loadFromSupabase(){
  if(!currentUser) return;
  const { data, error } = await sbRest('gymlog_data', { filter: `user_id=eq.${currentUser.id}&select=*` });
  if(error || !data || data.length === 0) return;
  const d = data[0];
  if(d.plan) state.plan = d.plan;
  if(d.history) state.history = d.history;
  if(d.settings) state.settings = d.settings;
  if(d.theme){ state.theme = d.theme; document.documentElement.setAttribute('data-theme', d.theme); }
  if(d.weight_history) state.weightHistory = d.weight_history;
  saveLocalOnly();
}
function saveLocalOnly(){

  save('gl_history', state.history); save('gl_settings', state.settings);
  save('gl_weights', state.weightHistory);

// ===== WEIGHT SUGGESTION =====
function getSuggestedWeight(exerciseId, setIndex){
  const hist = state.weightHistory[exerciseId];
  if(!hist || hist.length === 0) return null;
  const now = Date.now(); const twoWeeks = 14 * 24 * 3600 * 1000;
  const recent = hist.filter(e => (now - e.ts) < twoWeeks && e.setIndex === setIndex && e.weight > 0);
  if(recent.length === 0){
    const any = hist.filter(e => (now - e.ts) < twoWeeks && e.weight > 0);
    if(any.length === 0) return null;
    return any[any.length - 1].weight;
  }
  return recent[recent.length - 1].weight;
}
function recordWeight(exerciseId, setIndex, weight){
  if(!weight || isNaN(parseFloat(weight))) return;
  const w = parseFloat(weight);
  if(!state.weightHistory[exerciseId]) state.weightHistory[exerciseId] = [];
  state.weightHistory[exerciseId].push({ ts: Date.now(), setIndex, weight: w });
  if(state.weightHistory[exerciseId].length > 50) state.weightHistory[exerciseId] = state.weightHistory[exerciseId].slice(-50);
}

// ===== UTILS =====
function parseRepMax(repsStr){
  if(repsStr==='max') return {type:'max'};
  const m = repsStr.match(/^(\d+)(?:-(\d+))?/);
  if(m){ return {type:'reps', min:parseInt(m[1]), max:m[2]?parseInt(m[2]):parseInt(m[1])}; }
  return {type:'reps', min:10, max:10};
}
function fmtTime(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; if(h>0) return `${h}:${pad(m)}:${pad(sec)}`; return `${pad(m)}:${pad(sec)}`; }
function pad(n){return String(n).padStart(2,'0');}
function today(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function getElapsed(){
  if(!state.session) return 0;
  let elapsed = (Date.now() - state.session.startTime) / 1000 - state.session.pausedDuration;
  if(state.session.isPaused) elapsed = state.session.elapsedAtPause;
  return Math.max(0,elapsed);
}
function genId(){ return Math.random().toString(36).substr(2,9); }
function extractYoutubeId(url){ const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/); return m ? m[1] : null; }
function calcCompletion(sessionData){
  if(!sessionData) return 0;
  let total=0, done=0;
  sessionData.exercises.forEach(ex=>{ ex.sets.forEach(set=>{ total++; if(set.done) done++; }); });
  return total>0 ? done/total : 0;
}
function buildSession(dayIdx){
  const day = state.plan[dayIdx];
  return {
    dayIndex: dayIdx, dayId: day.id, dayName: day.name,
    startTime: Date.now(), pausedDuration: 0, elapsedAtPause: 0, isPaused: false,
    exercises: day.exercises.map(ex=>{
      const rep = parseRepMax(ex.reps);
      return {
        exerciseId: ex.id, name: ex.name, type: ex.type, duration: ex.duration||45,
        sets: Array.from({length:ex.sets},(_,si)=>({
          weight:'', repsCompleted:[], maxReps: rep.type==='reps'?rep.max:0,
          repsDone: 0, done:false, timerRunning:false,
          timerRemaining:ex.duration||45, timerDone:false,
          suggestedWeight: getSuggestedWeight(ex.id, si),
        }))
      };
    })
  };
}

    html += `<button class="btn btn-danger btn-sm" onclick="cancelWorkout()">✕ ANULUJ</button>`;
  }
  html += `</div></div>`;

  if(!session){
    const day = state.plan[state.selectedDay];
    const totalSets = day.exercises.reduce((a,e)=>a+e.sets,0);
    html += `<div class="section-title">${day.exercises.length} ĆWICZEŃ • ${totalSets} SERII</div>`;
    day.exercises.forEach((ex,i)=>{
      const suggested = getSuggestedWeight(ex.id, 0);
      html += `<div class="card" style="display:flex;align-items:center;gap:12px;padding:14px 16px;">
        <div class="ex-icon">${i+1}</div>

          <div class="ex-name">${ex.name}</div>

        </div>

      </div>`;
    });

    const totalSets = session.exercises.reduce((a,e)=>a+e.sets.length,0);
    const doneSets = session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    const pct = totalSets>0?Math.round(doneSets/totalSets*100):0;

    html += `<div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${doneSets}/${totalSets} SERII • ${pct}% UKOŃCZONO</div>
    </div>`;

    session.exercises.forEach((exData,ei)=>{
      const planEx = day.exercises[ei];

        <div class="ex-header" onclick="handleExerciseClick(event,${ei})">

            <div class="ex-meta">${planEx.sets}×${planEx.reps}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${allDone?'<span class="ex-done-badge">✓ GOTOWE</span>':''}
            <div class="ex-progress">`;
      exData.sets.forEach(s=>{ html += `<div class="ex-dot${s.done?' done':''}"></div>`; });
      html += `</div></div></div><div class="ex-sets">`;

      exData.sets.forEach((set,si)=>{

        html += `<div class="set-row${set.done?' done-set':''}" id="set-${ei}-${si}">

            <span class="weight-unit">kg</span>
            ${suggested && !set.weight ? `<div class="suggested-weight" onclick="applySuggested(${ei},${si},${suggested})">💡${suggested}</div>` : ''}
          </div>`;

        if(exData.type==='reps'){
          html += `<div class="set-done-row">
            <span class="reps-info">${planEx.reps} <span style="font-size:.7rem;color:var(--text3);">REPS</span></span>
            <button class="big-done-btn${set.done?' done':''}" onclick="toggleSetDone(${ei},${si})">

          html += `<div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:.8rem;color:var(--text2);">REPS:</span>

              value="${set.repsDone||''}" oninput="setMaxReps(${ei},${si},this.value)">
            <button class="set-done-btn${set.done?' done':''}" onclick="toggleSetDone(${ei},${si})">
              ${set.done?'✓ DONE':'DONE'}
            </button>

        } else if(exData.type==='time'){
          const dur = planEx.duration||45;
          const rem = set.timerRemaining!==undefined?set.timerRemaining:dur;
          html += `<div class="timer-set">

              : set.timerRunning

                : `<button class="timer-start-btn" onclick="startSetTimer(${ei},${si},${dur})">▶ START</button>`}
          </div>`;
        }
        html += `</div>`;
      });
      html += `</div></div>`;
    });
  }

  el.innerHTML = html;
  if(session && !session.isPaused) startTimerTick();
}

function applySuggested(ei, si, weight){
  if(!state.session) return;
  state.session.exercises[ei].sets[si].weight = String(weight);
  saveAll(); renderWorkout();
}
function handleExerciseClick(event, ei){
  const target = event.target;
  if(target.classList.contains('has-video')){
    const planEx = state.plan[state.session.dayIndex].exercises[ei];
    openVideoModal(planEx);
  }
}
function startTimerTick(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const el = document.getElementById('timer-display');
    if(el) el.textContent = fmtTime(getElapsed());
  }, 1000);
}
function selectDay(i){
  if(state.session){ if(!confirm('Zmiana dnia anuluje aktywny trening. Kontynuować?')) return; cancelWorkout(); }
  state.selectedDay = i; saveAll(); renderWorkout();
}
function startWorkout(){
  state.session = buildSession(state.selectedDay);
  state.session.exercises.forEach((ex,ei)=>{
    ex.sets.forEach((set,si)=>{ set.suggestedWeight = getSuggestedWeight(ex.exerciseId, si); });
  });
  saveAll(); startTimerTick(); renderWorkout();
}
function pauseWorkout(){
  if(!state.session) return;
  state.session.elapsedAtPause = getElapsed();
  state.session.isPaused = true;
  clearInterval(timerInterval);
  saveAll(); renderWorkout();
}
function resumeWorkout(){
  if(!state.session) return;
  const pauseStart = state.session.startTime + (state.session.elapsedAtPause + state.session.pausedDuration) * 1000;
  state.session.pausedDuration += (Date.now() - pauseStart) / 1000 + state.session.elapsedAtPause;
  state.session.startTime = Date.now();
  state.session.pausedDuration = 0;
  state.session.startTime = Date.now() - state.session.elapsedAtPause * 1000;
  state.session.isPaused = false;
  saveAll(); startTimerTick(); renderWorkout();
}
function cancelWorkout(){
  if(!confirm('Anulować trening? Dane zostaną utracone.')) return;
  clearInterval(timerInterval); state.session = null; saveAll(); renderWorkout();
}
function completeWorkout(){
  if(!state.session) return;
  const duration = getElapsed();
  const completion = calcCompletion(state.session);
  const dateStr = today();
  state.history[dateStr] = {
    dayName: state.session.dayName,
    duration, completionRate: completion,
    exercises: state.session.exercises.map(ex=>({
      name: ex.name,
      sets: ex.sets.map(s=>({ done: s.done, weight: s.weight, repsDone: s.repsDone||s.repsCompleted.length }))
    }))
  };
  clearInterval(timerInterval);
  const completedSession = state.session;
  state.session = null;
  saveAll();
  const el = document.getElementById('tab-workout');
  el.innerHTML = `<div class="workout-summary">
    <div class="summary-icon">🏆</div>
    <div class="summary-title">TRENING UKOŃCZONY!</div>
    <div style="color:var(--text2);font-size:.9rem;">${completedSession.dayName}</div>
    <div class="summary-stats">
      <div class="summary-stat"><div class="val">${fmtTime(duration)}</div><div class="lbl">CZAS</div></div>
      <div class="summary-stat"><div class="val">${Math.round(completion*100)}%</div><div class="lbl">UKOŃCZONO</div></div>
      <div class="summary-stat"><div class="val">${completedSession.exercises.length}</div><div class="lbl">ĆWICZEŃ</div></div>
    </div>
    <button class="btn btn-primary" style="margin-top:24px;width:100%;" onclick="renderWorkout()">NOWY TRENING</button>
  </div>`;
}

// Reps / sets
function setWeight(ei, si, val){
  if(!state.session) return;
  state.session.exercises[ei].sets[si].weight = val;
  recordWeight(state.session.exercises[ei].exerciseId, si, val);
  saveAll();
}
function toggleRep(ei, si, r){
  if(!state.session) return;
  const set = state.session.exercises[ei].sets[si];
  const idx = set.repsCompleted.indexOf(r);
  if(idx>=0){ set.repsCompleted.splice(idx,1); }
  else {
    set.repsCompleted.push(r);
    const planEx = state.plan[state.session.dayIndex].exercises[ei];
    const maxR = parseRepMax(planEx.reps).max;
    if(set.repsCompleted.length === maxR){
      set.done = true;
      if(state.settings.restTimer) startRestTimer();
    }
  }
  if(set.repsCompleted.length < (parseRepMax(state.plan[state.session.dayIndex].exercises[ei].reps).max)) set.done = false;
  saveAll(); renderWorkout();
}
function setMaxReps(ei, si, val){ if(!state.session) return; state.session.exercises[ei].sets[si].repsDone = parseInt(val)||0; saveAll(); }
function toggleSetDone(ei, si){
  if(!state.session) return;
  const set = state.session.exercises[ei].sets[si];
  set.done = !set.done;
  if(set.done && state.settings.restTimer) startRestTimer();
  saveAll(); renderWorkout();
}
function startSetTimer(ei, si, dur){
  if(!state.session) return;
  const set = state.session.exercises[ei].sets[si];
  if(set.timerRunning) return;
  set.timerRunning = true;
  if(!set.timerRemaining || set.timerRemaining<=0) set.timerRemaining = dur;
  setTimers[`${ei}-${si}`] = setInterval(()=>{
    const s2 = state.session.exercises[ei].sets[si];
    s2.timerRemaining--;
    const el = document.getElementById(`tc-${ei}-${si}`);
    if(el) el.textContent = fmtTime(s2.timerRemaining);
    if(s2.timerRemaining <= 0){
      clearInterval(setTimers[`${ei}-${si}`]);
      s2.timerRunning = false; s2.timerDone = true; s2.done = true;
      if(state.settings.restTimer) startRestTimer();
      saveAll(); renderWorkout();
    }
  }, 1000);
  saveAll(); renderWorkout();
}
function stopSetTimer(ei, si){
  clearInterval(setTimers[`${ei}-${si}`]);
  if(state.session) state.session.exercises[ei].sets[si].timerRunning = false;
  saveAll(); renderWorkout();
}

        <option value="time">Czas (timer)</option>
      </select></div>
    <div class="form-field"><label class="form-label">LINK DO WIDEO (opcjonalnie)</label>
      <input class="form-input" id="ae-video" placeholder="https://youtube.com/..."></div>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">ANULUJ</button>
      <button class="btn btn-primary btn-sm" onclick="addExercise(${di})">DODAJ</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}
function addExercise(di){
  const name = document.getElementById('ae-name').value.trim();
  if(!name){ alert('Podaj nazwę ćwiczenia.'); return; }
  const sets = parseInt(document.getElementById('ae-sets').value)||3;
  const reps = document.getElementById('ae-reps').value.trim()||'10';
  const type = document.getElementById('ae-type').value;
  const videoUrl = document.getElementById('ae-video').value.trim();
  const newEx = { id: genId(), name, sets, reps, type, videoUrl };
  if(type==='time') newEx.duration = 45;
  state.plan[di].exercises.push(newEx);
  saveAll(); closeModal(); renderPlan();
}

function openEditExModal(di, ei){
  const ex = state.plan[di].exercises[ei];
  const box = document.getElementById('modal-box');
  box.innerHTML = `<div class="modal-handle"></div>
    <div class="modal-title">EDYTUJ ĆWICZENIE</div>
    <div class="form-field"><label class="form-label">NAZWA</label>
      <input class="form-input" id="ee-name" value="${ex.name}"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">SERIE</label>
        <input class="form-input" id="ee-sets" type="number" value="${ex.sets}" min="1" inputmode="numeric"></div>
      <div class="form-field"><label class="form-label">POWTÓRZENIA</label>
        <input class="form-input" id="ee-reps" value="${ex.reps}"></div>
    </div>
    <div class="form-field"><label class="form-label">TYP</label>
      <select class="form-input" id="ee-type">
        <option value="reps"${ex.type==='reps'?' selected':''}>Powtórzenia</option>
        <option value="max"${ex.type==='max'?' selected':''}>Max</option>
        <option value="time"${ex.type==='time'?' selected':''}>Czas</option>
      </select></div>
    <div class="form-field"><label class="form-label">WIDEO URL</label>
      <input class="form-input" id="ee-video" value="${ex.videoUrl||''}"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">ANULUJ</button>
      <button class="btn btn-primary btn-sm" onclick="saveEditEx(${di},${ei})">ZAPISZ</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}
function saveEditEx(di, ei){
  const ex = state.plan[di].exercises[ei];
  ex.name = document.getElementById('ee-name').value.trim()||ex.name;
  ex.sets = parseInt(document.getElementById('ee-sets').value)||ex.sets;
  ex.reps = document.getElementById('ee-reps').value.trim()||ex.reps;
  ex.type = document.getElementById('ee-type').value;
  ex.videoUrl = document.getElementById('ee-video').value.trim();
  saveAll(); closeModal(); renderPlan();
}
function deleteExercise(di, ei){
  if(!confirm('Usunąć ćwiczenie?')) return;
  state.plan[di].exercises.splice(ei,1);
  saveAll(); renderPlan();
}

function openVideoModal(ex){
  const ytId = extractYoutubeId(ex.videoUrl||'');
  const box = document.getElementById('modal-box');
  box.innerHTML = `<div class="modal-handle"></div>
    <div class="modal-title">${ex.name}</div>
    ${ytId
      ? `<div class="video-preview"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`
      : `<div style="text-align:center;padding:30px;color:var(--text2);">Brak wideo.</div>`}
    <div class="modal-actions"><button class="btn btn-secondary btn-sm" onclick="closeModal()">ZAMKNIJ</button></div>`;
  document.getElementById('modal').classList.add('open');
}

// ===== MODAL =====
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function closeModalIfOverlay(e){ if(e.target===document.getElementById('modal')) closeModal(); }

// ===== TRACKER =====
function renderTracker(){
  const el = document.getElementById('tab-tracker');
  let html = `<div class="tracker-nav">
    <button class="tracker-btn${state.trackerView==='month'?' active':''}" onclick="setTrackerView('month')">MIESIĄC</button>
    <button class="tracker-btn${state.trackerView==='week'?' active':''}" onclick="setTrackerView('week')">TYDZIEŃ</button>
    <button class="tracker-btn${state.trackerView==='year'?' active':''}" onclick="setTrackerView('year')">ROK</button>
  </div>`;
  if(state.trackerView==='month') html+=renderMonthView();
  else if(state.trackerView==='week') html+=renderWeekView();
  else html+=renderYearView();
  el.innerHTML=html;
}
function setTrackerView(v){ state.trackerView=v; renderTracker(); }
function getWorkoutClass(rate){
  if(rate===undefined||rate===null) return '';
  if(rate>=0.8) return 'full'; if(rate>=0.5) return 'partial'; if(rate>0) return 'low'; return '';
}

function renderMonthView(){
  const y=state.trackerYear, m=state.trackerMonth;
  const monthNames=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  const todayStr=today();
  let html=`<div class="month-header">
    <button class="month-nav-btn" onclick="changeMonth(-1)">←</button>
    <div class="month-title">${monthNames[m]} ${y}</div>
    <button class="month-nav-btn" onclick="changeMonth(1)">→</button>
  </div><div class="cal-grid">`;
  ['PON','WT','ŚR','CZW','PT','SOB','NIE'].forEach(d=>{html+=`<div class="cal-day-label">${d}</div>`;});
  const firstDay=new Date(y,m,1).getDay(), firstMon=(firstDay===0?6:firstDay-1);
  const daysInMonth=new Date(y,m+1,0).getDate();
  const totalCells=Math.ceil((firstMon+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayNum=i-firstMon+1;
    if(dayNum<1||dayNum>daysInMonth){html+=`<div class="cal-cell empty"></div>`;continue;}
    const dateStr=dateKey(y,m,dayNum);
    const h=state.history[dateStr], isFuture=dateStr>todayStr, isToday=dateStr===todayStr;
    const cls=isFuture?'future':(h?getWorkoutClass(h.completionRate):'no-workout');
    const icon=h?(h.completionRate>=0.8?'★':h.completionRate>=0.5?'◑':'▲'):'';
    html+=`<div class="cal-cell ${cls}${isToday?' today':''}" onclick="showDayDetail('${dateStr}')">
      <div class="cal-day-num">${dayNum}</div><div class="cal-day-icon">${icon}</div></div>`;
  }
  html+=`</div>`;
  return html;
}
function changeMonth(d){
  state.trackerMonth+=d;
  if(state.trackerMonth<0){state.trackerMonth=11;state.trackerYear--;}
  if(state.trackerMonth>11){state.trackerMonth=0;state.trackerYear++;}
  renderTracker();
}

function renderWeekView(){
  const now=new Date(), dayOfWeek=now.getDay()===0?6:now.getDay()-1;
  const weekStart=new Date(now); weekStart.setDate(now.getDate()-dayOfWeek);
  const days=['PON','WT','ŚR','CZW','PT','SOB','NIE'];
  let totalDuration=0, totalExercises=0;
  let html='<div class="week-days">';
  for(let i=0;i<7;i++){
    const d=new Date(weekStart); d.setDate(weekStart.getDate()+i);
    const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const h=state.history[key], isToday=key===today();
    if(h){ totalDuration+=h.duration||0; totalExercises+=h.exercises?.length||0; }
    html+=`<div class="week-day-card${h?' has-workout':''}${isToday?' today-card':''}">
      <div class="week-day-name">${days[i]}</div>
      <div class="week-day-date">${d.getDate()}</div>`;
    if(h){
      html+=`<div class="week-stat"><span class="val">${fmtTime(h.duration||0)}</span><br>czas</div>
        <div class="week-stat"><span class="val">${Math.round((h.completionRate||0)*100)}%</span><br>ukończ.</div>`;
    } else {
      html+=`<div style="font-size:1.2rem;margin:6px 0;">${isToday?'⏳':'—'}</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  const daysWithWorkout=Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; return state.history[key]?1:0; }).reduce((a,b)=>a+b,0);
  html+=`<div class="week-totals">
    <div class="week-total-card"><div class="lbl">TRENINGI</div><div class="val">${daysWithWorkout}/7</div></div>
    <div class="week-total-card"><div class="lbl">ŁĄCZNY CZAS</div><div class="val">${fmtTime(totalDuration)}</div></div>
    <div class="week-total-card"><div class="lbl">ŚR. CZAS</div><div class="val">${daysWithWorkout?fmtTime(Math.round(totalDuration/daysWithWorkout)):'—'}</div></div>
  </div>`;
  return html;
}

function renderYearView(){
  const now=new Date(), todayStr=today();
  const yearStart=new Date(now.getFullYear(),0,1);
  const yearStartDay=yearStart.getDay()===0?6:yearStart.getDay()-1;
  const startDate=new Date(yearStart); startDate.setDate(1-yearStartDay);
  const monthLabels=['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
  let html=`<div class="year-grid-wrap"><div style="display:flex">
    <div class="year-day-labels">${['','Wt','','Cz','','So',''].map(l=>`<div class="year-day-label">${l}</div>`).join('')}</div>
    <div><div class="year-months">`;
  let monthAdded=new Array(12).fill(false);
  for(let w=0;w<53;w++){
    const d=new Date(startDate); d.setDate(startDate.getDate()+w*7);
    const mon=d.getMonth();
    if(!monthAdded[mon]){ html+=`<div class="year-month-label" style="width:${13*3}px">${monthLabels[mon]}</div>`; monthAdded[mon]=true; }
  }
  html+=`</div><div class="year-grid">`;
  for(let w=0;w<53;w++){
    html+=`<div class="year-col">`;
    for(let dw=0;dw<7;dw++){
      const d=new Date(startDate); d.setDate(startDate.getDate()+w*7+dw);
      const key=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const h=state.history[key], isFuture=key>todayStr;
      const cls=isFuture?'':(h?getWorkoutClass(h.completionRate):'');
      html+=`<div class="year-cell ${cls}" title="${key}${h?' – '+h.dayName:''}"></div>`;
    }
    html+=`</div>`;
  }
  html+=`</div></div></div></div>`;
  html+=`<div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;">
    <span style="font-size:.72rem;color:var(--text2);">LEGENDA:</span>
    ${[['var(--bg2)','Brak'],['rgba(22,101,52,.5)','Niski'],['var(--greenDim)','Dobry'],['var(--green)','Pełny']].map(([c,l])=>`<span style="display:flex;align-items:center;gap:4px;font-size:.7rem;color:var(--text2);"><div style="width:11px;height:11px;border-radius:2px;background:${c}"></div>${l}</span>`).join('')}
  </div>`;
  return html;
}

function showDayDetail(dateStr){
  const h=state.history[dateStr];
  if(!h) return;
  const box=document.getElementById('modal-box');
  let exerciseSummary='';
  if(h.exercises){
    h.exercises.forEach(ex=>{
      const doneSets=ex.sets.filter(s=>s.done).length;
      const weightsUsed=ex.sets.filter(s=>s.weight&&parseFloat(s.weight)>0).map(s=>s.weight+'kg').join(', ');
      exerciseSummary+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem;">
        <div><span>${ex.name}</span>${weightsUsed?`<div style="font-size:.72rem;color:var(--accent3);margin-top:2px;">💪 ${weightsUsed}</div>`:''}</div>
        <span style="color:${doneSets===ex.sets.length?'var(--green)':'var(--text2)'};">${doneSets}/${ex.sets.length}</span>
      </div>`;
    });
  }
  box.innerHTML=`<div class="modal-handle"></div>
    <div class="modal-title">${dateStr}</div>
    <div style="margin-bottom:16px">
      <div style="color:var(--accent3);font-weight:700;font-size:1rem;">${h.dayName}</div>
      <div style="color:var(--text2);font-size:.85rem;margin-top:4px;">
        Czas: <strong style="color:var(--text)">${fmtTime(h.duration)}</strong> • 
        Ukończono: <strong style="color:var(--text)">${Math.round(h.completionRate*100)}%</strong>
      </div>
    </div>
    ${exerciseSummary}
    <div class="modal-actions"><button class="btn btn-secondary btn-sm" onclick="closeModal()">ZAMKNIJ</button></div>`;
  document.getElementById('modal').classList.add('open');
}

// ===== SETTINGS =====
function renderSettings(){
  const el=document.getElementById('tab-settings');
  const themeColors={purple:['#7c3aed','#a855f7','#c084fc'],green:['#16a34a','#22c55e','#4ade80'],teal:['#0891b2','#06b6d4','#22d3ee'],gray:['#4b5563','#6b7280','#9ca3af']};
  const themeLabels={purple:'Fioletowy',green:'Zielony',teal:'Turkusowy',gray:'Szary'};

  let profileHtml='';
  if(isOfflineMode){
    profileHtml=`<div class="settings-section"><div class="settings-title">KONTO</div>
      <div class="profile-card">
        <div class="profile-avatar">?</div>
        <div class="profile-info"><div class="profile-email">Tryb Offline</div><div class="profile-mode">Dane lokalne</div></div>
        <span class="offline-badge">OFFLINE</span>
      </div></div>`;
  } else if(currentUser){
    profileHtml=`<div class="settings-section"><div class="settings-title">KONTO</div>
      <div class="profile-card">
        <div class="profile-avatar">${(currentUser.username||'U')[0].toUpperCase()}</div>
        <div class="profile-info"><div class="profile-email">${currentUser.username}</div><div class="profile-mode">Synchronizacja aktywna</div></div>
        <span class="online-badge">ONLINE</span>
      </div>
      <button class="action-btn" onclick="forceSyncNow()">☁️ SYNCHRONIZUJ TERAZ</button>
    </div>`;
  }

  let html=profileHtml;
  html+=`<div class="settings-section"><div class="settings-title">MOTYW</div><div class="theme-options">`;
  Object.keys(themeLabels).forEach(t=>{
    const cols=themeColors[t];
    html+=`<div class="theme-option theme-${t}${state.theme===t?' selected':''}" onclick="setTheme('${t}')">
      <div class="theme-name">${themeLabels[t]}</div>
      <div class="theme-swatch">${cols.map(c=>`<div class="swatch" style="background:${c}"></div>`).join('')}</div>
    </div>`;
  });
  html+=`</div></div>`;

  html+=`<div class="settings-section"><div class="settings-title">OPCJE TRENINGU</div>
    <div class="settings-toggle">
      <div style="flex:1"><div class="toggle-label">Timer odpoczynku</div><div class="toggle-desc">Auto-odliczacz po serii</div></div>
      <div class="toggle-switch${state.settings.restTimer?' on':''}" onclick="toggleSetting('restTimer')"><div class="toggle-knob"></div></div>
    </div>
    <div class="settings-toggle" style="margin-top:8px;">
      <div style="flex:1"><div class="toggle-label">Czas odpoczynku</div><div class="toggle-desc">${state.settings.restDuration}s</div></div>
      <div style="display:flex;gap:6px;">
        ${[60,90,120,180].map(s=>`<button class="plan-btn" style="${state.settings.restDuration===s?'border-color:var(--accent);color:var(--accent3);':''}" onclick="setRestDuration(${s})">${s}s</button>`).join('')}
      </div>
    </div>
  </div>`;

  html+=`<div class="settings-section"><div class="settings-title">DANE</div>
    <div class="data-actions">
      <button class="action-btn" onclick="exportDataFull()">📤 EKSPORTUJ WSZYSTKO</button>
      <button class="action-btn" onclick="importDataFull()">📥 IMPORTUJ</button>
      <button class="action-btn danger" onclick="resetPlan()">↺ RESETUJ PLAN</button>
      <button class="action-btn danger" onclick="clearHistory()">🗑 WYCZYŚĆ HISTORIĘ</button>
    </div>
  </div>`;

  html+=`<div class="settings-section"><div class="settings-title">O APLIKACJI</div>
    <div style="color:var(--text2);font-size:.88rem;line-height:1.8;">
      <strong style="color:var(--accent3);">⚡ GymLog</strong> — osobisty tracker treningów<br>
      Dane synchronizowane z Supabase lub lokalnie.<br>
      💡 System sugestii wag na podstawie historii.<br>
      📱 <strong style="color:var(--text);">Jak zainstalować:</strong> w przeglądarce kliknij<br>
      <em style="color:var(--accent3);">Udostępnij → Dodaj do ekranu głównego</em><br>
      <span style="color:var(--text3);font-size:.75rem;">Wersja 2.0 Mobile</span>
    </div>
  </div>`;

  el.innerHTML=html;
}

async function forceSyncNow(){ await syncToSupabase(); showToast('✓ Zsynchronizowano!'); }
function setTheme(t){ state.theme=t; document.documentElement.setAttribute('data-theme',t); saveAll(); renderSettings(); }
function toggleSetting(key){ state.settings[key]=!state.settings[key]; saveAll(); renderSettings(); }
function setRestDuration(s){ state.settings.restDuration=s; saveAll(); renderSettings(); }

function exportDataFull(){
  const data={ version:2, exportDate:new Date().toISOString(), plan:state.plan, history:state.history, settings:state.settings, theme:state.theme, weightHistory:state.weightHistory };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`gymlog-backup-${today()}.json`; a.click();
  showToast('📤 Eksport gotowy!');
}
function importDataFull(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.plan) state.plan=d.plan;
        if(d.history) state.history=d.history;
        if(d.settings) state.settings=d.settings;
        if(d.theme){state.theme=d.theme;document.documentElement.setAttribute('data-theme',d.theme);}
        if(d.weightHistory) state.weightHistory=d.weightHistory;
        saveAll(); renderTab(state.tab); showToast('✓ Import udany!');
      }catch(err){ alert('Błąd importu: '+err.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetPlan(){
  if(!confirm('Zresetować plan?')) return;
  state.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));
  saveAll(); renderPlan(); showToast('↺ Plan zresetowany.');
}
function clearHistory(){
  if(!confirm('Wyczyścić całą historię?')) return;
  state.history={};
  saveAll(); renderTracker(); showToast('🗑 Historia wyczyszczona.');
}

// ===== INIT =====
document.documentElement.setAttribute('data-theme', state.theme);
</script>
</body>
</html>
